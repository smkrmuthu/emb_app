name = "emb-bill-scanner"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Comma-separated list of origins allowed to call this endpoint — the frontend
# is deployed both to GitHub Pages and to a Cloudflare Workers static-assets
# site. Add a new origin here (comma-separated) if you deploy it anywhere else.
[vars]
ALLOWED_ORIGIN = "https://smkrmuthu.github.io,https://explain-my-bill.smkrmuthu.workers.dev"

# ANTHROPIC_API_KEY is NOT set here — it's a secret, set once via:
#   npx wrangler secret put ANTHROPIC_API_KEY
# (run from this worker/ directory, after `wrangler login`)
